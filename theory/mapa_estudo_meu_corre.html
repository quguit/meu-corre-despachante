<script>
const chapters = [
  {
    id: 1,

    subtitle: "A linguagem tem um estilo oficial. Seu código precisa falar essa língua.",
    why: "Você já usa decorators e ABC — mas provavelmente mistura estilos. Antes de arquitetura, o código precisa ser legível por qualquer dev Python.",
    theory: [
      { topic: "Nomenclatura de variáveis e funções", rule: "snake_case", example: "ordem_servico, calcular_saldo, cliente_id" },
      { topic: "Classes e tipos", rule: "PascalCase", example: "OrdemServico, ClienteRepository, StatusOS" },
      { topic: "Constantes", rule: "UPPER_SNAKE_CASE", example: "PRAZO_CRITICO_DIAS = 5" },
      { topic: "Módulos e arquivos", rule: "snake_case", example: "ordem_servico.py, cliente_repo.py" },
      { topic: "Métodos privados", rule: "_prefixo", example: "_calcular_total(), __id_interno" },
      { topic: "Enums", rule: "PascalCase + UPPER membros", example: "class StatusOS(Enum): EM_ANDAMENTO = 'em_andamento'" },
    ],
    code: `# ❌ Errado — mistura de estilos
class ordem_servico:
    def CalcularSaldo(self, ValorTotal, valorPago):
        RESULTADO = ValorTotal - valorPago
        return RESULTADO

# ✅ Correto — PEP 8
PRAZO_CRITICO_DIAS = 5  # constante: UPPER_SNAKE_CASE

class OrdemServico:           # classe: PascalCase
    def calcular_saldo(       # método: snake_case
        self,
        valor_total: float,   # parâmetro: snake_case
        valor_pago: float,
    ) -> float:
        return valor_total - valor_pago`,
    entrega: "Criar domain/entities/ordem_servico.py com nomenclatura 100% PEP 8",
    refs: ["PEP 8", "PEP 257 (docstrings)"]
  },
  {
    id: 2,
    label: "Cap 2 — SOLID",
    color: "#0C447C", bg: "#E6F1FB", border: "#85B7EB",
    title: "SOLID — os 5 princípios aplicados ao projeto",
    subtitle: "Não são regras abstratas. Cada princípio resolve uma dor de manutenção específica.",
    why: "Você conhece OOP e ABC — SOLID é o próximo nível: como organizar classes para que mudar uma coisa não quebre outra.",
    principles: [
      {
        name: "S — Single Responsibility",
        pain: "Classe que faz tudo quebra quando qualquer detalhe muda",
        rule: "Uma classe, uma razão para mudar",
        example: "OrdemServico só representa dados. Não salva, não gera PDF, não envia notificação.",
        bad: "class OrdemServico:\n    def salvar(self): ...     # ❌ responsabilidade do repo\n    def gerar_pdf(self): ... # ❌ responsabilidade do gerador\n    def notificar(self): ... # ❌ responsabilidade do notifier",
        good: "class OrdemServico:        # só representa o dado\nclass OrdemRepo:           # só persiste\nclass GeradorPDF:          # só gera PDF\nclass AlertaService:       # só notifica"
      },
      {
        name: "O — Open/Closed",
        pain: "Adicionar funcionalidade obriga a mexer em código que já funciona",
        rule: "Aberto para extensão, fechado para modificação",
        example: "Para adicionar novo tipo de serviço, cria nova classe — não mexe na existente.",
        bad: "def calcular_taxa(tipo):\n    if tipo == 'transferencia': return 350\n    if tipo == 'emplacamento': return 280\n    # ❌ toda vez que surge tipo novo, mexe aqui",
        good: "class TaxaServico(ABC):\n    @abstractmethod\n    def calcular(self) -> float: ...\n\nclass TaxaTransferencia(TaxaServico):\n    def calcular(self) -> float: return 350.0\n\nclass TaxaEmplacamento(TaxaServico):\n    def calcular(self) -> float: return 280.0"
      },
      {
        name: "L — Liskov Substitution",
        pain: "Subclasse quebra comportamento esperado pela classe pai",
        rule: "Subclasse deve poder substituir a classe pai sem surpreesas",
        example: "SQLiteOrdemRepo e PostgresOrdemRepo são intercambiáveis — mesma interface, comportamento equivalente.",
        bad: "class PostgresRepo(OrdemRepo):\n    def listar_ativas(self):\n        raise NotImplementedError  # ❌ quebra o contrato",
        good: "class PostgresRepo(OrdemRepo):\n    def listar_ativas(self) -> list[OrdemServico]:\n        # implementação real — honra o contrato\n        return self.session.query(OrdemServico).all()"
      },
      {
        name: "I — Interface Segregation",
        pain: "Interface grande força implementar métodos que não fazem sentido",
        rule: "Interfaces pequenas e específicas, não uma gigante",
        example: "Repositório de leitura separado do de escrita — o dashboard só precisa ler.",
        bad: "class OrdemRepo(ABC):\n    def salvar(self): ...\n    def deletar(self): ...\n    def listar(self): ...\n    def gerar_relatorio(self): ... # ❌ mistura responsabilidades",
        good: "class OrdemRepoLeitura(ABC):\n    def listar_ativas(self): ...\n    def buscar_por_placa(self): ...\n\nclass OrdemRepoEscrita(ABC):\n    def salvar(self): ...\n    def atualizar_status(self): ..."
      },
      {
        name: "D — Dependency Inversion",
        pain: "Código de alto nível depende de detalhe de implementação — trocar SQLite por Postgres exige reescrever tudo",
        rule: "Dependa de abstrações, nunca de implementações concretas",
        example: "O use case recebe OrdemRepo (ABC), não SQLiteOrdemRepo. Pode testar com FakeRepo.",
        bad: "class ListarCriticas:\n    def __init__(self):\n        self.repo = SQLiteOrdemRepo()  # ❌ acoplado ao SQLite",
        good: "class ListarCriticas:\n    def __init__(self, repo: OrdemRepoLeitura):  # ✅ abstração\n        self.repo = repo\n    # teste: ListarCriticas(FakeRepo())\n    # prod:  ListarCriticas(SQLiteOrdemRepo())"
      }
    ],
    entrega: "Criar domain/repositories/ordem_repo.py com as ABCs separadas por responsabilidade",
    refs: ["Clean Code — Robert Martin", "Architecture Patterns with Python"]
  },
  {
    id: 3,
    label: "Cap 3 — Clean Arch",
    color: "#3C3489", bg: "#EEEDFE", border: "#AFA9EC",
    title: "Clean Architecture — as camadas e a regra de dependência",
    subtitle: "Uma regra só: dependências apontam para dentro. Nunca para fora.",
    why: "Você já viu o diagrama de pastas. Este capítulo explica o POR QUÊ de cada camada existir e o que nunca pode atravessar a fronteira.",
    layers: [
      { name: "Domain (núcleo)", color: "#E1F5EE", border: "#9FE1CB", textColor: "#085041", desc: "Entidades puras. Sem import de SQLAlchemy, PySide6 ou FastAPI. Se um arquivo desta pasta importar algo externo, está errado.", files: "entities/ordem_servico.py · entities/cliente.py · entities/documento.py" },
      { name: "Use Cases", color: "#E6F1FB", border: "#85B7EB", textColor: "#0C447C", desc: "Orquestram as entidades. Dependem só do domain. Recebem repositório por injeção (DIP). São testáveis sem banco.", files: "listar_ordens_criticas.py · concluir_ordem.py · calcular_saldo_cliente.py" },
      { name: "Infrastructure", color: "#FAEEDA", border: "#FAC775", textColor: "#412402", desc: "Implementações concretas. SQLAlchemy, arquivos, PDFs. Implementa as ABCs do domain.", files: "sqlite/ordem_repo_sqlite.py · pdf/gerador_pdf.py" },
      { name: "Presentation", color: "#FCEBEB", border: "#F09595", textColor: "#791F1F", desc: "PySide6 ou Flutter. Chama use cases. Nunca acessa banco diretamente.", files: "pyside6/painel_ordens.py · pyside6/detalhe_os.py" },
    ],
    rule: "Domain não importa nada do projeto. Use cases importam só domain. Infrastructure importa domain + libs externas. Presentation importa use cases.",
    entrega: "Revisar estrutura de pastas e garantir que nenhum import viola a regra de dependência",
    refs: ["Clean Architecture — Uncle Bob", "Architecture Patterns with Python — Percival & Gregory"]
  },
  {
    id: 4,
    label: "Cap 4 — Patterns",
    color: "#633806", bg: "#FAEEDA", border: "#FAC775",
    title: "Design Patterns aplicados ao projeto",
    subtitle: "Você já conhece alguns. Agora vamos usá-los onde fazem sentido — não em todo lugar.",

    patterns: [
      { name: "Repository", where: "infrastructure/sqlite/", why: "Isola SQL do resto. Use case não sabe se é SQLite ou Postgres.", when: "Toda vez que precisar persistir uma entidade" },
      { name: "Factory", where: "infrastructure/factory.py", why: "Cria o grafo de dependências em um lugar só. main.py fica limpo.", when: "Na inicialização da app — monta repo → use case → presenter" },
      { name: "Observer / Event", where: "use_cases/events/", why: "Quando OS conclui, dispara evento. Financeiro reage. Sem acoplamento.", when: "Integração entre módulos (Despachante → Financeiro)" },
      { name: "Strategy", where: "domain/services/", why: "Cálculo de taxa varia por tipo de serviço. Cada estratégia encapsula uma regra.", when: "Regras que variam por tipo — taxa, prazo, fluxo de documentos" },
      { name: "DTO (Data Transfer Object)", where: "use_cases/dtos/", why: "O que a UI recebe não é a entidade bruta. DTO é a fronteira entre camadas.", when: "Sempre que use case retornar dados para a apresentação" },
    ],
    entrega: "Implementar Factory para montar o grafo: SQLiteOrdemRepo → ListarCriticas → PainelOrdens",
    refs: ["Refactoring Guru — padrões com exemplos Python"]
  },
  {
    id: 5,
    label: "Cap 5 — SQLAlchemy",
    color: "#27500A", bg: "#EAF3DE", border: "#C0DD97",
    title: "SQLAlchemy ORM — modelos, sessões e migrations",
    subtitle: "O ORM é só a implementação do Repository. O domínio não sabe que ele existe.",
    why: "Você nunca usou SQLAlchemy — é o único conceito novo técnico desta lista. A boa notícia: com Clean Architecture, ele fica isolado numa pasta só.",
    topics: [
      { t: "Mapped classes", d: "Como declarar modelos com DeclarativeBase — diferente de entidades de domínio" },
      { t: "Session e Unit of Work", d: "Como gerenciar transações com context manager — o padrão correto com with session:" },
      { t: "Relationships", d: "Cliente 1:N OrdemServico · OS 1:N Documento — como declarar e carregar" },
      { t: "Queries", d: "select(), where(), order_by() — sintaxe moderna do SQLAlchemy 2.0" },
      { t: "Alembic (migrations)", d: "Versionamento do schema — nunca mais alterar banco na mão" },
    ],
    code: `# infrastructure/sqlite/models.py — modelo SQLAlchemy
from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column
from datetime import date

class Base(DeclarativeBase): pass

class OrdemServicoModel(Base):
    __tablename__ = "ordens_servico"

    id: Mapped[int] = mapped_column(primary_key=True)
    placa: Mapped[str] = mapped_column(nullable=False)
    status: Mapped[str] = mapped_column(default="recebida")
    vencimento_vistoria: Mapped[date | None]

# IMPORTANTE: este modelo NÃO é a entidade de domínio
# O repositório converte Model → Entity ao retornar`,
    entrega: "Criar todos os models SQLAlchemy e o repositório concreto com as queries das 4 dores",
    refs: ["Documentação oficial SQLAlchemy 2.0", "Alembic docs"]
  },
  {
    id: 6,
    label: "Cap 6 — Testes",

    title: "pytest — testar sem banco, sem UI",
    subtitle: "Se o código é testável, a arquitetura está certa. Se não é, algo está acoplado demais.",

    code: `# tests/use_cases/test_listar_criticas.py
from datetime import date, timedelta
from unittest.mock import MagicMock
from use_cases.listar_ordens_criticas import ListarOrdensCriticas
from domain.entities.ordem_servico import OrdemServico, StatusOS

def make_os(dias_para_vencer: int) -> OrdemServico:
    return OrdemServico(
        id=1, placa="ABC-1234", cliente_id=1,
        status=StatusOS.EM_ANDAMENTO,
        vencimento_vistoria=date.today() + timedelta(days=dias_para_vencer)
    )

def test_retorna_apenas_os_com_prazo_critico():
    repo = MagicMock()
    repo.listar_por_prazo.return_value = [make_os(3)]  # 3 dias → crítico

    uc = ListarOrdensCriticas(repo)

    assert len(resultado) == 1
    assert resultado[0].placa == "ABC-1234"
    repo.listar_por_prazo.assert_called_once_with(5)  # verifica contrato`,

let current = 0;

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = chapters.map((ch, i) => 
    `<button class="nav-btn ${i === current ? 'active' : ''}" onclick="show(${i})">${ch.label}</button>`
  ).join('');
}

  let html = `

      </div>`;

    </div>
  </div>`;

  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <button class="nav-btn" onclick="show(${current-1})" ${current===0?'style="opacity:.3;pointer-events:none"':''}>← Anterior</button>
    <span style="font-size:11px;color:var(--color-text-tertiary)">${current+1} / ${chapters.length}</span>
    <button class="nav-btn" onclick="show(${current+1})" ${current===chapters.length-1?'style="opacity:.3;pointer-events:none"':''}>Próximo →</button>
  </div>`;

  el.innerHTML = html;
}

function show(i) {
  if (i < 0 || i >= chapters.length) return;
  current = i;
  renderNav();
  renderContent();
}

show(0);
</script>
